<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Kaiwen Notify</title>
  <script>try{var t=localStorage.getItem('kn-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <main id="app">
    <header class="topbar">
      <div class="brand"><div class="brand-mark" aria-hidden="true"><span></span><span></span></div><span class="brand-name">Kaiwen Notify</span></div>
      <span class="version" id="app-version">v—</span>
    </header>

    <section id="setup-view" class="view" hidden aria-labelledby="setup-title">
      <h1 id="setup-title" data-i18n="onboarding.title"></h1>
      <p class="lead" data-i18n="onboarding.lead"></p>
      <ul class="providers" id="setup-providers"></ul>
      <button class="btn btn-primary btn-wide" id="install-integrations" disabled type="button"><span class="btn-label" data-i18n="onboarding.install"></span></button>
      <p id="setup-feedback" class="note" role="status"></p>
      <p class="note" data-i18n="onboarding.note"></p>
    </section>

    <div id="dashboard-view" class="view" hidden>
      <section class="card status" aria-live="polite">
        <div class="status-line"><span id="status-dot" class="dot"></span><span id="status-label"></span></div>
        <span class="muted tabular" id="event-count"></span>
      </section>

      <section class="card">
        <h2 data-i18n="integrations.title"></h2>
        <ul class="providers" id="dash-providers"></ul>
        <p id="integration-message" class="note" role="status"></p>
        <div id="antigravity-diag" class="diag" hidden></div>
      </section>

      <section class="card">
        <h2 data-i18n="sound.title"></h2>
        <div class="row">
          <div class="grow"><div id="sound-name" class="strong ellipsis"></div><div id="sound-info" class="muted small"></div></div>
          <button id="pick-sound" class="btn" type="button" data-i18n="sound.change"></button>
        </div>
        <div class="actions">
          <button id="test-sound" class="btn btn-primary" type="button"><span class="btn-label" data-i18n="sound.test"></span></button>
          <button id="reset-sound" class="btn btn-quiet" type="button" data-i18n="sound.reset"></button>
        </div>
      </section>

      <section class="card">
        <h2 data-i18n="settings.title"></h2>
        <label class="row setting"><span class="grow"><span class="strong" data-i18n="settings.enable"></span><span class="muted small block" data-i18n="settings.enableDesc"></span></span><span class="switch"><input id="enabled" type="checkbox" checked /><span class="track"></span></span></label>
        <label class="row setting"><span class="grow"><span class="strong" data-i18n="settings.autoUpdate"></span><span class="muted small block" id="auto-update-desc"></span></span><span class="switch"><input id="auto-update" type="checkbox" checked /><span class="track"></span></span></label>
        <label class="row setting"><span class="grow"><span class="strong" data-i18n="settings.autostart"></span><span class="muted small block" data-i18n="settings.autostartDesc"></span></span><span class="switch"><input id="autostart" type="checkbox" /><span class="track"></span></span></label>
        <div class="row setting"><span class="grow strong" data-i18n="settings.theme"></span>
          <div class="segmented" role="radiogroup" data-i18n-aria="settings.theme">
            <button type="button" data-theme-choice="system" role="radio" data-i18n="settings.theme.system"></button>
            <button type="button" data-theme-choice="light" role="radio" data-i18n="settings.theme.light"></button>
            <button type="button" data-theme-choice="dark" role="radio" data-i18n="settings.theme.dark"></button>
          </div>
        </div>
        <div class="row setting"><span class="grow strong" data-i18n="settings.language"></span>
          <div class="segmented" role="radiogroup" data-i18n-aria="settings.language" id="language-choices">
            <button type="button" data-language-choice="system" role="radio" data-i18n="settings.language.system"></button>
            <button type="button" data-language-choice="en" role="radio">English</button>
            <button type="button" data-language-choice="tr" role="radio">Türkçe</button>
          </div>
        </div>
      </section>

      <section class="card" id="update-card">
        <h2 data-i18n="update.title"></h2>
        <div class="row">
          <div class="grow"><div id="update-title" class="strong"></div><div id="update-sub" class="muted small"></div></div>
          <button id="update-action" class="btn" type="button"><span class="btn-label"></span></button>
        </div>
        <div id="update-progress" class="progress" hidden><div class="bar" id="update-bar"></div></div>
        <div id="update-bytes" class="muted small tabular" hidden></div>
        <pre id="update-notes" class="notes" hidden></pre>
      </section>

      <section class="card">
        <h2 data-i18n="manage.title"></h2>
        <div class="actions">
          <button id="reinstall-integrations" class="btn" type="button"><span class="btn-label" data-i18n="manage.repair"></span></button>
          <button id="uninstall-integrations" class="btn btn-danger" type="button"><span class="btn-label" data-i18n="manage.uninstall"></span></button>
        </div>
      </section>
      <footer><span id="last-event"></span><span data-i18n="footer.tray"></span></footer>
    </div>

    <dialog id="confirm-dialog" aria-labelledby="confirm-title">
      <form method="dialog">
        <h2 id="confirm-title" data-i18n="dialog.uninstallTitle"></h2>
        <p class="muted" data-i18n="dialog.uninstallBody"></p>
        <div class="actions end"><button value="cancel" class="btn" data-i18n="dialog.cancel"></button><button value="confirm" class="btn btn-danger" id="confirm-yes" data-i18n="dialog.remove"></button></div>
      </form>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
