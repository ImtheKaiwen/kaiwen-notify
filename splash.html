<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Kaiwen Notify</title>
  <script>try{var t=localStorage.getItem('kn-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <div id="stage" class="stage" aria-hidden="true">
    <div class="logos" id="logos">
      <span class="tile" style="--i:0"><img class="logo" src="/assets/providers/antigravity.png" alt="" /></span>
      <span class="tile" style="--i:1"><span class="logo logo-mono" style="--logo:url('/assets/providers/openai-chatgpt.svg')"></span></span>
      <span class="tile" style="--i:2"><img class="logo" src="/assets/providers/claude-ai.svg" alt="" /></span>
    </div>
    <div class="lockup" id="lockup">
      <img class="app-icon" src="/assets/brand/app-icon.png" alt="" />
      <span class="wordmark">Kaiwen Notify</span>
    </div>
  </div>
  <script type="module" src="/src/splash.ts"></script>
</body>
</html>
