name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install pytest pillow
      - name: Secret hygiene scan
        run: python scripts/secret-scan.py
      - run: npm ci --no-audit --no-fund
      - name: Version consistency + contract tests
        run: python -m pytest tests -q
      - name: TypeScript typecheck + frontend build
        run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Windows production build (unsigned, updater disabled)
        run: npm run desktop:build
      - name: Verify installer artifact
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe
          if (-not $exe) { throw 'NSIS installer missing' }
          $exe | ForEach-Object { "{0} ({1:N1} MB)" -f $_.Name, ($_.Length/1MB) }
      - uses: actions/upload-artifact@v7
        with:
          name: kaiwen-notify-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
