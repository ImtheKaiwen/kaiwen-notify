name: Release (draft)
# Builds a signed installer + updater artifacts and uploads them to a DRAFT GitHub Release.
# Nothing is published publicly: a maintainer must review and publish the draft by hand.
# Required (Settings > Secrets and variables > Actions):
#   secret   TAURI_SIGNING_PRIVATE_KEY           (+ TAURI_SIGNING_PRIVATE_KEY_PASSWORD if the key has one)
#   variable UPDATER_PUBKEY                      (public key from `npm run tauri signer generate`)
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      UPDATER_PUBKEY: ${{ vars.UPDATER_PUBKEY }}
    steps:
      - name: Block publish when signing setup is missing
        shell: pwsh
        run: |
          $missing = @()
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { $missing += 'secret TAURI_SIGNING_PRIVATE_KEY' }
          if (-not $env:UPDATER_PUBKEY) { $missing += 'variable UPDATER_PUBKEY' }
          if ($missing) { throw "Release blocked. Missing: $($missing -join ', '). See docs/RELEASING.md." }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest pillow
      - run: python -m pytest tests/test_contract.py -q
      - name: Tag must match app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match version v$v" }
      - run: npm ci --no-audit --no-fund
      - name: Write updater config (endpoint derived from this repository)
        env:
          UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
        run: node scripts/make-updater-config.mjs
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Kaiwen Notify v__VERSION__'
          releaseBody: 'See CHANGELOG.md. Draft: review before publishing.'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json
      - name: Verify release artifacts
        shell: pwsh
        run: |
          $nsis = 'src-tauri/target/release/bundle/nsis'
          $exe = Get-ChildItem "$nsis/*.exe" | Select-Object -First 1
          if (-not $exe) { throw 'Installer missing' }
          if (-not (Test-Path "$($exe.FullName).sig")) { throw 'Updater signature (.sig) missing' }
          Write-Host "OK: $($exe.Name) + .sig"
          $tag = "v$((Get-Content package.json | ConvertFrom-Json).version)"
          $names = gh release view $tag --repo ${{ github.repository }} --json assets --jq '.assets[].name'
          if ($names -notcontains 'latest.json') { throw 'latest.json missing from release' }
          $names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
