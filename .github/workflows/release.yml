name: Release
# Builds the signed NSIS installer + updater artifacts, uploads them to a DRAFT release, verifies every asset,
# and only then publishes. Secrets/variable required (Settings > Secrets and variables > Actions):
#   secret   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#   variable UPDATER_PUBKEY
# Trigger: push a tag vX.Y.Z (must match package.json, Cargo.toml, tauri.conf.json and a CHANGELOG section),
# or run manually against an existing tag with `workflow_dispatch` (publish=false leaves the draft).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the release after verification'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      UPDATER_PUBKEY: ${{ vars.UPDATER_PUBKEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Block release when signing setup is missing
        shell: pwsh
        run: |
          $missing = @()
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { $missing += 'secret TAURI_SIGNING_PRIVATE_KEY' }
          if (-not $env:UPDATER_PUBKEY) { $missing += 'variable UPDATER_PUBKEY' }
          if ($missing) { throw "Release blocked. Missing: $($missing -join ', '). See docs/RELEASING.md." }
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install pytest pillow
      - name: Resolve and validate the version
        id: meta
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Release runs need a vX.Y.Z tag (got '$tag')" }
          $version = $tag.Substring(1)
          python scripts/release_tools.py check-versions $version
          if ($LASTEXITCODE -ne 0) { throw 'Version check failed' }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Secret scan and contract tests
        run: |
          python scripts/secret-scan.py
          python -m pytest tests/test_contract.py tests/test_v05_contracts.py -q
      - run: npm ci --no-audit --no-fund
      - name: Write updater config (endpoint derived from this repository)
        env:
          UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
        run: node scripts/make-updater-config.mjs
      - name: Release notes
        id: notes
        shell: pwsh
        run: |
          $body = python scripts/release_tools.py notes "${{ steps.meta.outputs.version }}"
          $delimiter = "EOF_$([guid]::NewGuid().ToString('N'))"
          "body<<$delimiter" >> $env:GITHUB_OUTPUT
          ($body -join "`n") >> $env:GITHUB_OUTPUT
          $delimiter >> $env:GITHUB_OUTPUT
      - uses: tauri-apps/tauri-action@v1
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: 'Kaiwen Notify ${{ steps.meta.outputs.tag }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.release.conf.json
      - name: Point latest.json at the permanent download URL
        run: python scripts/release_tools.py finalize-manifest ${{ steps.meta.outputs.tag }} ${{ github.repository }}
      - name: Verify draft release assets
        run: python scripts/release_tools.py verify-assets ${{ steps.meta.outputs.tag }} ${{ github.repository }}

  publish:
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Publish the verified draft
        run: gh release edit ${{ needs.build.outputs.tag }} --repo ${{ github.repository }} --draft=false --latest
      - name: Verify the public updater endpoint
        shell: pwsh
        run: |
          # GitHub needs a moment to serve /releases/latest after publishing.
          $ok = $false
          foreach ($attempt in 1..12) {
            python scripts/release_tools.py verify-endpoint ${{ github.repository }}
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Start-Sleep -Seconds 10
          }
          if (-not $ok) { throw 'Public latest.json endpoint did not verify' }
